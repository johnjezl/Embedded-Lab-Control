[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI; the import package and CLI stay `labctl`.
name = "embedded-lab-control"
dynamic = ["version"]
description = "Centralized management system for embedded development lab resources"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "John Jezl"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
]
web = [
    "flask>=3.0",
    "flask-socketio>=5.0",
]
mcp = [
    "mcp>=2.2,<3",
]
# PyPI sdwire requires Python >= 3.12; on older interpreters the extra
# installs nothing and SDWire commands report "sdwire package not installed".
sdwire = [
    "sdwire>=0.3; python_version >= '3.12'",
]
kasa = [
    "python-kasa>=0.5",
]
actuators = [
    "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/johnjezl/Embedded-Lab-Control"
Repository = "https://github.com/johnjezl/Embedded-Lab-Control"
Issues = "https://github.com/johnjezl/Embedded-Lab-Control/issues"
Changelog = "https://github.com/johnjezl/Embedded-Lab-Control/blob/main/CHANGELOG.md"

[project.scripts]
labctl = "labctl.cli:main"

[tool.setuptools.dynamic]
version = {attr = "labctl.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labctl = [
    "web/templates/**/*.html",
    "web/static/**/*",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
